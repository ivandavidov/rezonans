<title>Резонанс</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Russo+One@@FONT_FAMILIES@@&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one centred arcade screen with a control legend beneath; a single dark control-room look */
  --bg:#080b0d; --frame:#12191e; --line:#25313a; --fg:#cfd8dc; --dim:#7f8e97; --amber:#ffa62b; --toxic:#94ff57;
  --display:"Russo One","Arial Black",Impact,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%;background:var(--bg)}
body{color:var(--fg);font-family:var(--mono);overflow-x:hidden}
.wrap{box-sizing:border-box;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding-inline:16px;padding-block:14px}
.screen{position:relative;width:min(100%, max(300px, calc((100vh - 150px) * 1.7647)), 1280px);aspect-ratio:480/272;max-width:100%;background:#000;border:1px solid var(--line);box-shadow:0 0 0 6px var(--frame),0 0 0 7px var(--line),0 20px 60px rgba(0,0,0,.6)}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;outline:none;filter:brightness(1.08)}
.keys{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 18px;font-size:12px;color:var(--dim);max-width:1280px}
.keys span{white-space:nowrap}
kbd{display:inline-block;min-width:1.6em;padding:1px 6px;margin-right:4px;border:1px solid #5a4520;border-bottom-width:2px;border-radius:3px;color:var(--amber);font:600 12px var(--mono);text-align:center;background:#16120a}
.touch{display:none;width:100%;max-width:720px;justify-content:space-between;align-items:center;gap:12px;user-select:none;-webkit-user-select:none;touch-action:none}
.pad,.acts{display:grid;gap:8px}
.pad{grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px)}
.acts{grid-template-columns:repeat(4,56px)}
.touch button{font:600 13px var(--mono);color:var(--amber);background:#16120a;border:1px solid #5a4520;border-radius:10px;touch-action:none;-webkit-tap-highlight-color:transparent}
.touch button:active,.touch button.on{background:#3a2a0e}
.acts button{height:56px;border-radius:50%;grid-row:2}.acts .esc{grid-row:1;grid-column:1/-1;justify-self:end;height:30px;padding:0 12px;border-radius:10px;border-style:dashed;font-size:11px}
.pad .am,.pad .as{grid-row:1;width:72%;height:72%;align-self:start;font-size:11px;border-style:dashed}.pad .am{grid-column:1;justify-self:start}.pad .as{grid-column:3;justify-self:end}.touch button.off{opacity:.35}
.pad .u{grid-column:2;grid-row:1}.pad .l{grid-column:1;grid-row:2}.pad .d{grid-column:2;grid-row:2}.pad .r{grid-column:3;grid-row:2}
body.has-e .acts{grid-template-columns:repeat(5,56px)}
/*@@GAME_CSS@@*/
@media (pointer:coarse){.touch{display:flex}.keys{display:none}}
@media (max-width:540px){.touch{--u:min(56px,calc((100vw - 68px)/5))}body.has-e .touch{--u:min(56px,calc((100vw - 76px)/6))}.pad{grid-template-columns:repeat(3,var(--u));grid-template-rows:repeat(2,var(--u))}.acts,body.has-e .acts{grid-template-columns:repeat(2,var(--u));grid-template-rows:auto repeat(2,var(--u))}body.has-e .acts{grid-template-columns:repeat(3,var(--u))}.acts button{height:var(--u)}.acts [data-k=swap]{grid-area:2/1}.acts [data-k=crouch]{grid-area:2/2}.acts [data-k=jump]{grid-area:3/1}.acts [data-k=fire]{grid-area:3/2}body.has-e .acts [data-k=era]{grid-area:2/3}body.has-e .acts [data-k=jump]{grid-area:3/2}body.has-e .acts [data-k=fire]{grid-area:3/3}}
@media (pointer:coarse) and (orientation:landscape) and (min-aspect-ratio:8/5){.wrap{padding:4px;gap:0;height:100%}.screen{width:min(100%,calc((100vh - 8px)*1.7647));width:min(100%,calc((100dvh - 8px)*1.7647))}.touch{display:block;position:fixed;inset:0;z-index:2;max-width:none;pointer-events:none;--u:clamp(44px,14vh,60px);--w:clamp(40px,calc((100vw - (100vh - 8px)*1.7647)/4 - 6px),var(--u));--b:max(8px,12vh);--sl:max(6px,env(safe-area-inset-left));--sr:max(6px,env(safe-area-inset-right))}.touch button{pointer-events:auto;opacity:.78;font-size:12px}.touch button.on,.touch button:active{opacity:1}.pad,.acts,body.has-e .acts{position:absolute;bottom:var(--b);gap:6px;grid-template-columns:repeat(2,var(--w))}.pad{left:var(--sl);grid-template-rows:calc(var(--u)*.8) var(--u) calc(var(--u)*.8)}.pad .u{grid-area:1/1/2/3}.pad .l{grid-area:2/1}.pad .r{grid-area:2/2}.pad .d{grid-area:3/1/4/3}.pad .am,.pad .as{position:fixed;top:6px;width:calc(var(--w)*.9);height:calc(var(--u)*.6)}.pad .am,.pad .as{left:var(--sl)}.pad .as{top:calc(12px + var(--u)*.6)}.acts,body.has-e .acts{right:var(--sr);grid-template-rows:repeat(2,var(--u))}body.has-e .acts{grid-template-rows:repeat(3,var(--u))}.acts button{height:auto;border-radius:14px}.acts .esc{position:fixed;top:6px;right:var(--sr);width:calc(var(--w)*1.4);height:calc(var(--u)*.6);padding:0}.acts .eh{display:none}.acts [data-k=crouch]{grid-area:1/1}.acts [data-k=swap]{grid-area:1/2}.acts [data-k=jump]{grid-area:2/1}.acts [data-k=fire]{grid-area:2/2}body.has-e .acts [data-k=era]{grid-area:1/1/2/3}body.has-e .acts [data-k=crouch]{grid-area:2/1}body.has-e .acts [data-k=swap]{grid-area:2/2}body.has-e .acts [data-k=jump]{grid-area:3/1}body.has-e .acts [data-k=fire]{grid-area:3/2}}
</style>

<div class="wrap">
  <div class="screen"><canvas id="game" tabindex="0" aria-label="Игра Резонанс"></canvas></div>
  <div class="keys">
    <span><kbd>←</kbd><kbd>→</kbd>движение</span>
    <span><kbd>↑</kbd>стълба / прицел нагоре</span>
    <span><kbd>↓</kbd>+<kbd>X</kbd>слизане от платформа</span>
    <span><kbd>Z</kbd>стрелба</span>
    <span><kbd>X</kbd>скок</span>
    <span><kbd>C</kbd>клякане</span>
    <span><kbd>Q</kbd>или <kbd>1</kbd>–<kbd>6</kbd>оръжие</span>
    <span><kbd>M</kbd>звук</span>
    <span><kbd>N</kbd>музика</span>
    <span><kbd>B</kbd>ефекти</span>
    <span><kbd>P</kbd>/<kbd>Esc</kbd>пауза</span>
    <span id="ekey" style="display:none"><kbd>E</kbd></span>
  </div>
  <div class="touch" id="touch">
    <div class="pad">
      <button class="am" id="bmus" data-a="mus" aria-label="музика">♪</button><button class="u" data-k="up">▲</button><button class="as" id="bsfx" data-a="sfx" aria-label="ефекти">FX</button><button class="l" data-k="left">◀</button><button class="d" data-k="down">▼</button><button class="r" data-k="right">▶</button>
    </div>
    <div class="acts">
      <button class="esc" data-k="esc" aria-label="пауза / назад">Esc<span class="eh"> · пауза</span></button><button data-k="swap">Q<br>оръж.</button><button data-k="crouch">C<br>клек</button><button data-k="jump">X<br>скок</button><button data-k="fire">Z<br>огън</button><button data-k="era" id="ebtn" style="display:none">E</button>
    </div>
  </div>
</div>
